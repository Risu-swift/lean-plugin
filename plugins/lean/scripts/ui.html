<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lean</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1c1c1e; --mute: #6b6b72; --line: #e3e3de; --chip: #efefea;
  --accent: #2f6fde; --ready: #1d9a52; --doing: #d08400; --wait: #8a8a91; --done: #5b8def; --bad: #d64545;
  --decision: #2f6fde; --gotcha: #d64545; --pattern: #1d9a52; --fact: #8e5bd8;
  --shadow: 0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --panel: #1d1d20; --ink: #ececef; --mute: #9a9aa3; --line: #2f2f35; --chip: #29292e; --shadow: none; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 20px 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.top h1 { font-size: 17px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; white-space: nowrap; }
.bar { display: inline-block; width: 90px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; vertical-align: middle; }
.bar > i { display: block; height: 100%; background: var(--ready); }
.live { margin-left: auto; font-size: 12px; color: var(--mute); }
.live b { color: var(--ready); } .live.off b { color: var(--bad); }
.focus { color: var(--mute); font-size: 13px; margin-top: 4px; }
nav { display: flex; gap: 2px; margin-top: 8px; }
nav a { padding: 7px 12px; color: var(--mute); text-decoration: none; font-weight: 500; border-bottom: 2px solid transparent; }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
.keys { margin-left: auto; font-size: 11px; color: var(--mute); align-self: center; }
main { padding: 16px 20px 40px; }
.muted { color: var(--mute); font-size: 12px; }
.empty { color: var(--mute); }

/* Board */
.blockers { border: 1px solid var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 980px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .board { grid-template-columns: 1fr; } }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
.col h2 span { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 0 7px; }
.tile { display: block; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--wait); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; color: inherit; text-decoration: none; box-shadow: var(--shadow); }
.tile:hover { border-color: var(--accent); }
.tile.s-ready { border-left-color: var(--ready); } .tile.s-doing { border-left-color: var(--doing); } .tile.s-done { border-left-color: var(--done); opacity: .78; }
.meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.tag { font-size: 11px; background: var(--chip); color: var(--mute); border-radius: 4px; padding: 1px 6px; text-decoration: none; white-space: nowrap; }
.tag.human { color: var(--fact); }
a.tag.s-ready, .status.s-ready, .c-ready { color: var(--ready); }
a.tag.s-doing, .status.s-doing, .c-doing { color: var(--doing); }
a.tag.s-done, .status.s-done { color: var(--done); }
a.tag.s-wait, .status.s-wait, .c-wait { color: var(--mute); }
.c-bad { color: var(--bad); }

/* Drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.14); overflow: auto; z-index: 10; }
.drawer-in { padding: 18px 22px 40px; }
.x { float: right; border: 0; background: var(--chip); color: var(--ink); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 14px; }
dl { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; }
dt { color: var(--mute); } dd { margin: 0; overflow-wrap: anywhere; }

/* Split views */
.split { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
input[type=search] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.pill { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 2px 10px; font: inherit; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.pill.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pill.small { font-size: 11px; padding: 1px 8px; }
details.tags summary { cursor: pointer; font-size: 12px; color: var(--mute); }
.count { font-size: 12px; color: var(--mute); margin-top: 6px; }
.list { list-style: none; margin: 6px 0 0; padding: 0; max-height: calc(100vh - 320px); overflow: auto; }
.list a { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 1px 8px; padding: 7px 8px; border-radius: 6px; color: inherit; text-decoration: none; }
.list a small { grid-column: 2; color: var(--mute); font-size: 11px; }
.list a:hover { background: var(--chip); } .list a.on { background: var(--chip); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--wait); margin-top: 5px; flex: none; }
.dot.t-decision { background: var(--decision); } .dot.t-gotcha { background: var(--gotcha); } .dot.t-pattern { background: var(--pattern); } .dot.t-fact { background: var(--fact); }
article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; min-width: 0; }
article h2, .drawer-in h2 { margin: 4px 0 10px; font-size: 19px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mute); margin: 18px 0 6px; }
.refs { display: flex; flex-direction: column; gap: 2px; }
.ref { display: flex; gap: 8px; align-items: flex-start; color: inherit; text-decoration: none; padding: 4px 6px; border-radius: 5px; }
.ref:hover { background: var(--chip); }
.btn { display: inline-block; margin-top: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Markdown */
.md { overflow-wrap: anywhere; }
.md h3, .md h4, .md h5 { text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 15px; margin: 16px 0 6px; }
.md pre { background: var(--chip); padding: 10px; border-radius: 6px; overflow: auto; }
.md code { background: var(--chip); padding: 0 4px; border-radius: 3px; font-size: 12.5px; }
.md pre code { background: none; padding: 0; }
.md ul, .md ol { padding-left: 22px; }
.box { display: inline-flex; width: 14px; height: 14px; border: 1px solid var(--mute); border-radius: 3px; margin-right: 6px; font-size: 10px; align-items: center; justify-content: center; vertical-align: -2px; }
.box.on { background: var(--ready); border-color: var(--ready); color: #fff; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { color: var(--mute); font-weight: 500; }
details > summary { cursor: pointer; }

/* Graph */
.graph-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--mute); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.legend .dot { margin: 0 4px 0 0; }
.sq { display: inline-block; width: 9px; height: 9px; background: var(--wait); margin-right: 4px; }
svg#graph { display: block; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; touch-action: none; cursor: grab; }
.edge { stroke: var(--line); stroke-width: 1.3; }
.edge.cite { stroke-dasharray: 3 3; }
.gnote { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; fill: var(--wait); }
.gnote.t-decision { fill: var(--decision); } .gnote.t-gotcha { fill: var(--gotcha); } .gnote.t-pattern { fill: var(--pattern); } .gnote.t-fact { fill: var(--fact); }
.gnote.global { stroke: var(--ink); stroke-dasharray: 2 2; }
.gcard { fill: var(--wait); cursor: pointer; rx: 2; }
.gcard.s-ready { fill: var(--ready); } .gcard.s-doing { fill: var(--doing); } .gcard.s-done { fill: var(--done); }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 12px; padding: 4px 8px; border-radius: 6px; max-width: 340px; z-index: 20; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="project">lean</h1>
    <div id="chips" class="chips"></div>
    <div id="live" class="live">connecting…</div>
  </div>
  <div id="focus" class="focus"></div>
  <nav>
    <a href="#board" data-view="board">Board</a>
    <a href="#notes" data-view="notes">Notes</a>
    <a href="#graph" data-view="graph">Graph</a>
    <a href="#specs" data-view="specs">Specs</a>
    <span class="keys">1–4 switch · / search · Esc close</span>
  </nav>
</header>
<main></main>
<aside id="drawer" hidden></aside>
<div id="tip" class="tip" hidden></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let DATA = null;
let RAW = '';
let route = { view: 'board', id: null };
let reportText = '';
let showCardsInGraph = false;
const noteFilter = { q: '', type: '', scope: '', tag: '' };

const cardById = (id) => DATA.cards.find((c) => c.id === id);
const noteById = (id) => DATA.notes.find((n) => n.id === id);

// ---------- data + routing ----------
async function load() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    const text = await res.text();
    setLive(true);
    if (text !== RAW) {
      RAW = text;
      DATA = JSON.parse(text);
      renderAll();
    }
  } catch {
    setLive(false);
  }
}

function setLive(ok) {
  const el = $('#live');
  el.className = ok ? 'live' : 'live off';
  el.innerHTML = ok ? '<b>●</b> live' : '<b>●</b> offline — run <code>lean ui</code>';
}

function parseHash() {
  const [view, id] = decodeURIComponent(location.hash.slice(1)).split('/');
  route = { view: ['board', 'notes', 'graph', 'specs', 'card'].includes(view) ? view : 'board', id: id || null };
}

async function loadReport() {
  try {
    reportText = await (await fetch('/api/report', { cache: 'no-store' })).text();
  } catch {
    reportText = 'Could not load the report.';
  }
  renderAll();
}

window.addEventListener('hashchange', () => {
  parseHash();
  if (route.view === 'specs' && route.id === 'report') loadReport();
  renderAll();
});

// ---------- render ----------
function renderAll() {
  if (!DATA) return;
  const active = document.activeElement;
  const focusId = active && active.id;
  const caret = active && active.selectionStart;

  renderHeader();
  const view = route.view === 'card' ? 'board' : route.view;
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('on', a.dataset.view === view));
  if (view !== 'graph' && graph.raf) cancelAnimationFrame(graph.raf);

  const main = $('main');
  if (view === 'board') main.innerHTML = boardHTML();
  if (view === 'notes') main.innerHTML = notesHTML();
  if (view === 'specs') main.innerHTML = specsHTML();
  if (view === 'graph') renderGraph(main);
  renderDrawer();

  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (caret != null && el.setSelectionRange) el.setSelectionRange(caret, caret);
    }
  }
}

function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
}

function renderHeader() {
  const d = DATA;
  const done = d.cards.filter((c) => c.status === 'done').length;
  const pct = d.cards.length ? Math.round((done / d.cards.length) * 100) : 0;
  const chips = [];
  if (d.days != null) {
    const col = d.days <= 3 ? 'var(--bad)' : d.days <= 7 ? 'var(--doing)' : 'inherit';
    chips.push(`<span class="chip" style="color:${col}">⏳ ${d.days}d → ${esc(d.deadlineLabel)}</span>`);
  }
  chips.push(`<span class="chip"><span class="bar"><i style="width:${pct}%"></i></span>${done}/${d.cards.length} done</span>`);
  if (d.lastTest) {
    const ok = d.lastTest.ok;
    chips.push(`<span class="chip" title="${esc(d.lastTest.cmd)}" style="color:${ok ? 'var(--ready)' : 'var(--bad)'}">${ok ? '✓ tests pass' : '✗ tests fail'} · ${ago(d.lastTest.at)}</span>`);
  }
  if (d.blockers.length) {
    chips.push(`<span class="chip" style="color:var(--bad)" title="${esc(d.blockers.join('\n'))}">⚠ ${d.blockers.length} blocker${d.blockers.length > 1 ? 's' : ''}</span>`);
  }
  $('#project').textContent = d.project;
  $('#chips').innerHTML = chips.join('');
  $('#focus').textContent = d.focus ? `Focus: ${d.focus}` : '';
  document.title = `${d.project} · lean`;
}

// ---------- board ----------
const COLUMNS = [['doing', 'Doing'], ['ready', 'Ready'], ['wait', 'Waiting'], ['done', 'Done']];

function boardHTML() {
  const blockers = DATA.blockers.length
    ? `<div class="blockers">${DATA.blockers.map((b) => `<div>⚠ ${esc(b)}</div>`).join('')}</div>`
    : '';
  const cols = COLUMNS.map(([key, label]) => {
    let cards = DATA.cards.filter((c) => c.status === key);
    if (key === 'done') cards = cards.sort((a, b) => String(b.done).localeCompare(String(a.done)));
    const tiles = cards.map(tileHTML).join('') || '<p class="empty">—</p>';
    return `<section class="col"><h2>${label} <span>${cards.length}</span></h2>${tiles}</section>`;
  }).join('');
  return `${blockers}<div class="board">${cols}</div>`;
}

function tileHTML(c) {
  const meta = [];
  if (c.title.startsWith('HUMAN:')) meta.push('<span class="tag human">human</span>');
  if (c.tdd) meta.push(`<span class="tag">${esc(c.tdd)}</span>`);
  if (c.branch) meta.push(`<span class="tag" title="${esc(c.branch)}">⎇ wip</span>`);
  if (c.status === 'wait') {
    const open = c.depends.filter((d) => cardById(d)?.status !== 'done');
    if (open.length) meta.push(`<span class="tag">needs ${open.map(esc).join(', ')}</span>`);
  }
  if (c.done) meta.push(`<span class="tag">✓ ${esc(c.done)}</span>`);
  return `<a class="tile s-${c.status}" href="#card/${esc(c.id)}"><b>${esc(c.id)}</b> ${esc(c.title)}<div class="meta">${meta.join('')}</div></a>`;
}

function cardChips(ids) {
  return ids.map((id) => `<a class="tag s-${cardById(id)?.status || 'wait'}" href="#card/${esc(id)}">${esc(id)}</a>`).join(' ') || '—';
}

function renderDrawer() {
  const el = $('#drawer');
  const c = route.view === 'card' ? cardById(route.id) : null;
  if (!c) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }
  const unblocks = DATA.cards.filter((x) => x.depends.includes(c.id)).map((x) => x.id);
  el.hidden = false;
  el.innerHTML = `<div class="drawer-in">
    <button class="x" data-close aria-label="Close">✕</button>
    <div class="muted">${esc(c.id)} · <span class="status s-${c.status}">${c.status}</span>${c.spec ? ` · <a href="#specs/${esc(c.spec)}">${esc(c.spec)}</a>` : ''}</div>
    <h2>${esc(c.title)}</h2>
    <dl>
      <dt>Needs</dt><dd>${cardChips(c.depends)}</dd>
      <dt>Unblocks</dt><dd>${cardChips(unblocks)}</dd>
      <dt>Files</dt><dd>${c.files.map((f) => `<code>${esc(f)}</code>`).join('<br>') || '—'}</dd>
      ${c.tdd ? `<dt>TDD</dt><dd>${esc(c.tdd)}</dd>` : ''}
      ${c.branch ? `<dt>Branch</dt><dd><code>${esc(c.branch)}</code></dd>` : ''}
      ${c.commit ? `<dt>Commit</dt><dd><code>${esc(c.commit)}</code> · ${esc(c.done || '')}</dd>` : ''}
      <dt>Card file</dt><dd><code>${esc(c.file)}</code></dd>
    </dl>
    <div class="md">${md(c.body)}</div>
  </div>`;
}

// ---------- notes ----------
function noteScore(n) {
  if (noteFilter.type && n.type !== noteFilter.type) return 0;
  if (noteFilter.scope && n.scope !== noteFilter.scope) return 0;
  if (noteFilter.tag && !n.tags.includes(noteFilter.tag)) return 0;
  const terms = noteFilter.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return 1;
  const head = `${n.title} ${n.tags.join(' ')} ${n.type} ${n.source} ${n.id}`.toLowerCase();
  const body = n.body.toLowerCase();
  let score = 0;
  for (const t of terms) {
    if (head.includes(t)) score += 2;
    else if (body.includes(t)) score += 1;
    else return 0;
  }
  return score;
}

function notesHTML() {
  const notes = DATA.notes;
  const hits = notes
    .map((n) => [n, noteScore(n)])
    .filter(([, s]) => s > 0)
    .sort((a, b) => b[1] - a[1] || b[0].id.localeCompare(a[0].id))
    .map(([n]) => n);
  const tagCounts = {};
  notes.forEach((n) => n.tags.forEach((t) => (tagCounts[t] = (tagCounts[t] || 0) + 1)));
  const sel = noteById(route.id);

  const typeBtns = ['', 'decision', 'gotcha', 'pattern', 'fact']
    .map((t) => `<button class="pill ${noteFilter.type === t ? 'on' : ''}" data-type="${t}">${t ? `<i class="dot t-${t}" style="margin:0"></i>${t}` : 'all types'}</button>`)
    .join('');
  const scopeBtns = [['', 'all'], ['P', 'project'], ['G', 'global']]
    .map(([s, l]) => `<button class="pill ${noteFilter.scope === s ? 'on' : ''}" data-scope="${s}">${l}</button>`)
    .join('');
  const tagBtns = Object.entries(tagCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([t, c]) => `<button class="pill small ${noteFilter.tag === t ? 'on' : ''}" data-tag="${esc(t)}">#${esc(t)} ${c}</button>`)
    .join('');
  const items = hits
    .map((n) => `<li><a class="${sel && sel.id === n.id ? 'on' : ''}" href="#notes/${esc(n.id)}"><i class="dot t-${esc(n.type)}"></i><span>${esc(n.title)}</span><small>${n.scope === 'G' ? 'global · ' : ''}${esc(n.id)}</small></a></li>`)
    .join('');

  return `<div class="split">
    <aside>
      <input id="q" type="search" placeholder="Search notes…   ( / )" value="${esc(noteFilter.q)}" autocomplete="off">
      <div class="pills">${typeBtns}</div>
      <div class="pills">${scopeBtns}</div>
      <details class="tags"${noteFilter.tag ? ' open' : ''}><summary>Tags${noteFilter.tag ? `: #${esc(noteFilter.tag)}` : ''}</summary><div class="pills">${tagBtns || '<span class="muted">no tags</span>'}</div></details>
      <div class="count">${hits.length} of ${notes.length} notes</div>
      <ul class="list">${items}</ul>
    </aside>
    <article>${sel ? noteDetailHTML(sel) : '<p class="empty">Pick a note on the left.</p>'}</article>
  </div>`;
}

function noteDetailHTML(n) {
  const outgoing = n.links.map(noteById).filter(Boolean);
  const incoming = DATA.notes.filter((x) => x.links.includes(n.id) && !n.links.includes(x.id));
  const citedBy = [
    ...DATA.cards.filter((c) => c.body.includes(n.id)).map((c) => `<a class="ref" href="#card/${esc(c.id)}"><b>${esc(c.id)}</b> ${esc(c.title)}</a>`),
    ...DATA.specs.filter((s) => s.body.includes(n.id)).map((s) => `<a class="ref" href="#specs/${esc(s.id)}"><b>${esc(s.id)}</b> ${esc(s.title)}</a>`),
  ];
  const refList = (arr) =>
    arr.length
      ? arr.map((x) => `<a class="ref" href="#notes/${esc(x.id)}"><i class="dot t-${esc(x.type)}"></i><span>${esc(x.title)}</span></a>`).join('')
      : '<span class="muted">—</span>';

  return `<div class="muted"><i class="dot t-${esc(n.type)}" style="margin:0 4px 0 0"></i>${esc(n.type)} · ${n.scope === 'G' ? 'global' : 'project'} · ${esc(n.id)}${n.created ? ` · ${esc(n.created)}` : ''}</div>
    <h2>${esc(n.title)}</h2>
    <div class="pills">${n.tags.map((t) => `<button class="pill small" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>
    ${n.source ? `<p class="muted">Source: ${linkify(esc(n.source))}</p>` : ''}
    <div class="md">${md(n.body)}</div>
    <h3>Links</h3><div class="refs">${refList(outgoing)}</div>
    ${incoming.length ? `<h3>Linked from</h3><div class="refs">${refList(incoming)}</div>` : ''}
    <h3>Cited by</h3><div class="refs">${citedBy.join('') || '<span class="muted">—</span>'}</div>`;
}

// ---------- specs ----------
function specCards(s) {
  return DATA.cards.filter((c) => c.spec === s.id);
}

function acceptance(s) {
  const m = /^##\s+Acceptance\s*$([\s\S]*?)(?=^##\s|(?![\s\S]))/m.exec(s.body);
  if (!m) return [];
  return m[1]
    .split(/\r?\n/)
    .map((l) => /^\s*[-*]?\s*\**(A\d+)\**\s*[:.)\-—]\s*(.*)$/.exec(l))
    .filter(Boolean)
    .map(([, id, text]) => {
      const re = new RegExp(`\\b${id}\\b`);
      return { id, text, cards: DATA.cards.filter((c) => (!c.spec || c.spec === s.id) && re.test(c.body)) };
    });
}

function specsHTML() {
  const specs = DATA.specs;
  const showReport = route.id === 'report';
  const sel = showReport ? null : specs.find((s) => s.id === route.id) || specs[0];
  const items = specs
    .map((s) => {
      const cards = specCards(s);
      const done = cards.filter((c) => c.status === 'done').length;
      const pct = cards.length ? Math.round((done / cards.length) * 100) : 0;
      return `<li><a class="${sel && sel.id === s.id ? 'on' : ''}" href="#specs/${esc(s.id)}"><i class="dot" style="background:var(--accent)"></i><span><b>${esc(s.id)}</b> ${esc(s.title)}</span><small><span class="bar"><i style="width:${pct}%"></i></span> ${done}/${cards.length} cards</small></a></li>`;
    })
    .join('');
  return `<div class="split">
    <aside>
      <ul class="list">${items || '<li class="empty">No specs yet — run /lean:grill</li>'}</ul>
      <a class="btn" href="#specs/report">📄 Progress report</a>
    </aside>
    <article>${showReport ? reportHTML() : sel ? specDetailHTML(sel) : ''}</article>
  </div>`;
}

function specDetailHTML(s) {
  const cards = specCards(s);
  const done = cards.filter((c) => c.status === 'done').length;
  const rows = acceptance(s)
    .map((a) => {
      const finished = a.cards.filter((c) => c.status === 'done').length;
      const started = finished > 0 || a.cards.some((c) => c.status === 'doing');
      const [cls, label] = !a.cards.length
        ? ['c-bad', '⚠ no card']
        : finished === a.cards.length
          ? ['c-ready', '✓ done']
          : started
            ? ['c-doing', '◐ in progress']
            : ['c-wait', '○ not started'];
      return `<tr><td><b>${esc(a.id)}</b></td><td>${linkify(inline(esc(a.text)))}</td><td>${cardChips(a.cards.map((c) => c.id))}</td><td class="${cls}" style="white-space:nowrap">${label}</td></tr>`;
    })
    .join('');
  return `<div class="muted">${esc(s.id)} · ${esc(s.status)} · ${done}/${cards.length} cards done · <code>${esc(s.file)}</code></div>
    <h2>${esc(s.title)}</h2>
    ${rows ? `<h3>Acceptance coverage</h3><div class="tbl"><table><thead><tr><th></th><th>Criterion</th><th>Cards</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>` : ''}
    <h3>Cards</h3><div>${cardChips(cards.map((c) => c.id))}</div>
    <details style="margin-top:16px"><summary>Full spec</summary><div class="md">${md(s.body)}</div></details>`;
}

function reportHTML() {
  return `<div class="row"><h2>Progress report</h2><button class="btn" id="copy-report" style="margin:0">Copy markdown</button></div>
    <div class="md">${reportText ? md(reportText) : 'Loading…'}</div>`;
}

// ---------- graph ----------
const graph = { raf: 0, pos: new Map(), view: { tx: 0, ty: 0, s: 1 } };

function renderGraph(main) {
  cancelAnimationFrame(graph.raf);
  main.innerHTML = `<div class="graph-bar">
      <label><input type="checkbox" id="g-cards" ${showCardsInGraph ? 'checked' : ''}> show cards that cite notes</label>
      <span class="legend">${['decision', 'gotcha', 'pattern', 'fact'].map((t) => `<span><i class="dot t-${t}"></i>${t}</span>`).join('')}<span><i class="sq"></i>card</span><span>dashed ring = global · drag, scroll to zoom</span></span>
    </div><svg id="graph"></svg>`;
  const svg = $('#graph');
  const W = svg.clientWidth || 900;
  const H = Math.max(420, window.innerHeight - 200);
  svg.style.height = `${H}px`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const nodes = DATA.notes.map((n) => ({ id: n.id, kind: 'note', type: n.type, scope: n.scope, label: n.title }));
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const edges = [];
  const seen = new Set();
  for (const n of DATA.notes) {
    for (const l of n.links) {
      const k = [n.id, l].sort().join('|');
      if (byId.has(l) && !seen.has(k)) {
        seen.add(k);
        edges.push({ s: byId.get(n.id), t: byId.get(l) });
      }
    }
  }
  if (showCardsInGraph) {
    for (const c of DATA.cards) {
      const cited = DATA.notes.filter((n) => c.body.includes(n.id));
      if (!cited.length) continue;
      const node = { id: c.id, kind: 'card', status: c.status, label: c.title };
      nodes.push(node);
      cited.forEach((n) => edges.push({ s: node, t: byId.get(n.id), cite: true }));
    }
  }
  const degree = new Map();
  edges.forEach((e) => {
    degree.set(e.s.id, (degree.get(e.s.id) || 0) + 1);
    degree.set(e.t.id, (degree.get(e.t.id) || 0) + 1);
  });
  for (const n of nodes) {
    const old = graph.pos.get(n.id);
    n.x = old ? old.x : W / 2 + (Math.random() - 0.5) * W * 0.6;
    n.y = old ? old.y : H / 2 + (Math.random() - 0.5) * H * 0.6;
    n.vx = 0;
    n.vy = 0;
    n.r = 5 + Math.min(7, degree.get(n.id) || 0);
    graph.pos.set(n.id, n);
  }

  const NS = 'http://www.w3.org/2000/svg';
  const vp = document.createElementNS(NS, 'g');
  svg.appendChild(vp);
  const view = graph.view;
  const applyView = () => vp.setAttribute('transform', `translate(${view.tx},${view.ty}) scale(${view.s})`);
  applyView();

  const lineEls = edges.map((e) => {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('class', e.cite ? 'edge cite' : 'edge');
    vp.appendChild(l);
    return l;
  });
  const tip = $('#tip');
  const nodeEls = nodes.map((n) => {
    const el = document.createElementNS(NS, n.kind === 'card' ? 'rect' : 'circle');
    if (n.kind === 'card') {
      el.setAttribute('class', `gcard s-${n.status}`);
      el.setAttribute('width', 12);
      el.setAttribute('height', 12);
    } else {
      el.setAttribute('class', `gnote t-${n.type}${n.scope === 'G' ? ' global' : ''}`);
      el.setAttribute('r', n.r);
    }
    el.addEventListener('pointerenter', () => {
      tip.hidden = false;
      tip.textContent = n.kind === 'card' ? `${n.id} ${n.label}` : `${n.label} (${n.type}${n.scope === 'G' ? ', global' : ''})`;
    });
    el.addEventListener('pointermove', (ev) => {
      tip.style.left = `${ev.clientX + 12}px`;
      tip.style.top = `${ev.clientY + 12}px`;
    });
    el.addEventListener('pointerleave', () => (tip.hidden = true));
    vp.appendChild(el);
    return el;
  });

  let alpha = 1;
  let running = false;
  let frames = 0;
  let drag = null;
  let pan = null;
  let moved = 0;
  const K = 70;

  function tick() {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i];
        const b = nodes[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const d2 = dx * dx + dy * dy || 0.01;
        if (d2 > 160000) continue;
        const d = Math.sqrt(d2);
        const f = Math.min(8, ((K * K) / d2) * 0.4) * alpha;
        dx /= d;
        dy /= d;
        a.vx -= dx * f; a.vy -= dy * f;
        b.vx += dx * f; b.vy += dy * f;
      }
    }
    for (const e of edges) {
      const dx = e.t.x - e.s.x;
      const dy = e.t.y - e.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - K) * 0.03 * alpha;
      e.s.vx += (dx / d) * f; e.s.vy += (dy / d) * f;
      e.t.vx -= (dx / d) * f; e.t.vy -= (dy / d) * f;
    }
    for (const n of nodes) {
      if (n === drag) continue;
      n.vx += (W / 2 - n.x) * 0.003 * alpha;
      n.vy += (H / 2 - n.y) * 0.003 * alpha;
      n.vx *= 0.6;
      n.vy *= 0.6;
      n.x += n.vx;
      n.y += n.vy;
    }
    alpha = Math.max(0.03, alpha * 0.985);
  }

  function draw() {
    edges.forEach((e, i) => {
      const l = lineEls[i];
      l.setAttribute('x1', e.s.x); l.setAttribute('y1', e.s.y);
      l.setAttribute('x2', e.t.x); l.setAttribute('y2', e.t.y);
    });
    nodes.forEach((n, i) => {
      const el = nodeEls[i];
      if (n.kind === 'card') {
        el.setAttribute('x', n.x - 6);
        el.setAttribute('y', n.y - 6);
      } else {
        el.setAttribute('cx', n.x);
        el.setAttribute('cy', n.y);
      }
    });
  }

  function loop() {
    tick();
    draw();
    if (++frames < 360 || drag) graph.raf = requestAnimationFrame(loop);
    else running = false;
  }
  function kick() {
    if (running) return;
    running = true;
    frames = 0;
    graph.raf = requestAnimationFrame(loop);
  }
  kick();

  const toGraph = (ev) => {
    const r = svg.getBoundingClientRect();
    return { x: (ev.clientX - r.left - view.tx) / view.s, y: (ev.clientY - r.top - view.ty) / view.s };
  };
  svg.addEventListener('pointerdown', (ev) => {
    const idx = nodeEls.indexOf(ev.target);
    svg.setPointerCapture(ev.pointerId);
    moved = 0;
    if (idx >= 0) drag = nodes[idx];
    else pan = { x: ev.clientX - view.tx, y: ev.clientY - view.ty };
  });
  svg.addEventListener('pointermove', (ev) => {
    if (drag) {
      const p = toGraph(ev);
      drag.x = p.x;
      drag.y = p.y;
      drag.vx = drag.vy = 0;
      moved++;
      alpha = Math.max(alpha, 0.3);
      kick();
    } else if (pan) {
      view.tx = ev.clientX - pan.x;
      view.ty = ev.clientY - pan.y;
      applyView();
    }
  });
  svg.addEventListener('pointerup', () => {
    if (drag && moved < 3) {
      tip.hidden = true;
      location.hash = drag.kind === 'card' ? `#card/${drag.id}` : `#notes/${drag.id}`;
    }
    drag = null;
    pan = null;
  });
  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    const px = ev.clientX - r.left;
    const py = ev.clientY - r.top;
    const f = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    view.tx = px - (px - view.tx) * f;
    view.ty = py - (py - view.ty) * f;
    view.s *= f;
    applyView();
  }, { passive: false });
}

// ---------- markdown (escaped first, so card text can never inject HTML) ----------
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}

function linkify(html) {
  let insideLink = 0;
  return html
    .split(/(<[^>]+>)/)
    .map((part) => {
      if (part.startsWith('<')) {
        if (/^<a\b/i.test(part)) insideLink++;
        else if (/^<\/a>/i.test(part)) insideLink--;
        return part;
      }
      if (insideLink) return part;
      return part
        .replace(/\bT-\d{3,}\b/g, (m) => (DATA && cardById(m) ? `<a href="#card/${m}">${m}</a>` : m))
        .replace(/\bS-\d{3,}\b/g, (m) => (DATA && DATA.specs.some((s) => s.id === m) ? `<a href="#specs/${m}">${m}</a>` : m))
        .replace(/\b\d{8}-\d{6}(?:-\d+)?\b/g, (m) => (DATA && noteById(m) ? `<a href="#notes/${m}">${m}</a>` : m));
    })
    .join('');
}

function md(src) {
  const lines = esc(src || '').split(/\r?\n/);
  const out = [];
  let para = [];
  let listKind = null;
  const flushPara = () => {
    if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`);
    para = [];
  };
  const closeList = () => {
    if (listKind) out.push(`</${listKind}>`);
    listKind = null;
  };
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);

  for (let i = 0; i < lines.length; ) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      flushPara(); closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      out.push(`<pre><code>${buf.join('\n')}</code></pre>`);
      i++;
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      flushPara(); closeList();
      const level = Math.min(6, h[1].length + 2);
      out.push(`<h${level}>${inline(h[2])}</h${level}>`);
      i++;
      continue;
    }
    if (isRow(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushPara(); closeList();
      const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && isRow(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    const li = /^\s*([-*]|\d+\.)\s+(.*)$/.exec(line);
    if (li) {
      flushPara();
      const kind = /\d/.test(li[1]) ? 'ol' : 'ul';
      if (listKind !== kind) {
        closeList();
        out.push(`<${kind}>`);
        listKind = kind;
      }
      const box = /^\[( |x|X)\]\s+(.*)$/.exec(li[2]);
      const text = box ? `<span class="box ${box[1].trim() ? 'on' : ''}">${box[1].trim() ? '✓' : ''}</span>${inline(box[2])}` : inline(li[2]);
      out.push(`<li>${text}</li>`);
      i++;
      continue;
    }
    if (!line.trim()) {
      flushPara(); closeList();
      i++;
      continue;
    }
    closeList();
    para.push(line);
    i++;
  }
  flushPara();
  closeList();
  return linkify(out.join('\n'));
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-close]')) {
    location.hash = '#board';
    return;
  }
  if (e.target.id === 'copy-report') {
    navigator.clipboard.writeText(reportText).then(() => (e.target.textContent = 'Copied ✓'));
    return;
  }
  const b = e.target.closest('button[data-type], button[data-scope], button[data-tag]');
  if (!b) return;
  if ('type' in b.dataset) noteFilter.type = b.dataset.type;
  if ('scope' in b.dataset) noteFilter.scope = b.dataset.scope;
  if ('tag' in b.dataset) noteFilter.tag = noteFilter.tag === b.dataset.tag ? '' : b.dataset.tag;
  if (route.view !== 'notes') location.hash = '#notes';
  else renderAll();
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    noteFilter.q = e.target.value;
    renderAll();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'g-cards') {
    showCardsInGraph = e.target.checked;
    renderAll();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) {
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const views = { 1: 'board', 2: 'notes', 3: 'graph', 4: 'specs' };
  if (views[e.key]) location.hash = `#${views[e.key]}`;
  if (e.key === '/') {
    e.preventDefault();
    if (route.view !== 'notes') location.hash = '#notes';
    setTimeout(() => $('#q') && $('#q').focus(), 40);
  }
  if (e.key === 'Escape' && route.view === 'card') location.hash = '#board';
});

parseHash();
if (route.view === 'specs' && route.id === 'report') loadReport();
load();
setInterval(load, 4000);
</script>
</body>
</html>
